<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="./favicon-48.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Turn tender PDFs into one checked, correctly ordered submission package. Runs fully in your browser." />
    <meta name="theme-color" content="#f6f7f9" />
    <script>
      // Light is the default. A saved choice is applied before the page paints, so dark mode has no white flash.
      var theme = 'light'
      try {
        if (localStorage.getItem('tpb-theme') === 'dark') theme = 'dark'
      } catch (e) {}
      document.documentElement.dataset.theme = theme
    </script>
    <title>Tender Package Builder</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
